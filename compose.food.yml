# ==============================================================================
# FMS_FILE_SPEC
# compose.food.yml - 프로젝트 설정 compose.food.yml
# ==============================================================================
# 설명:
#     - 프로젝트 설정 compose.food.yml
# 입력·출력 명세:
#     - 입력: 도구별 설정·실행 환경
#     - 출력: 해당 도구의 구성 또는 실행 결과
# 실행 가정:
#     - 실제 비밀값과 로컬 실행 데이터는 Git에서 제외
# 작성 정보:
#     - 작성자: 미지정
#     - 이메일: 미지정
#     - 작성일: 2026-10-21 (최초 Git 등록일 기준)
#     - 라이선스: 미지정
#     - 버전: 0.1.0
#     - 상태: Development
# 변경 이력 (Revision History):
#     DATE        AUTHOR      VERSION  DESCRIPTION
#     --------------------------------------------------------------------
#     2026-10-21  미지정      v0.1.0   최초 Git 등록 a11ef05a
#     2026-10-21  미지정      v0.1.0   파일 역할·입출력·가정·이력 명세 추가
#
#     상세 Git 이력: git log --follow -- compose.food.yml
#     공통 규칙: doc/file-header-policy.md
# ==============================================================================
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: food_agent
    volumes: [food-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U food -d food_agent]
      interval: 5s
      retries: 10
  api:
    build: {context: ., dockerfile: Dockerfile.food}
    ports: ["127.0.0.1:8100:8100"]
    environment: &app-env
      DATABASE_URL: postgresql://food:${POSTGRES_PASSWORD}@db:5432/food_agent
      FOOD_DATA_DIR: /data/assets
      FOOD_CREDENTIAL_KEY_FILE: /data/assets/.credential.key
      FOOD_SEED_PASSWORD: ${FOOD_SEED_PASSWORD:?set FOOD_SEED_PASSWORD}
      FOOD_ANALYSIS_MODE: ${FOOD_ANALYSIS_MODE:-agent}
      FOOD_MODEL_URL: ${FOOD_MODEL_URL:-http://host.docker.internal:11434}
      FOOD_MODEL_NAME: ${FOOD_MODEL_NAME:-qwen3:8b}
      FOOD_MODEL_CONCURRENCY: ${FOOD_MODEL_CONCURRENCY:-1}
      FOOD_OCR_ENABLED: ${FOOD_OCR_ENABLED:-false}
    volumes: [food-assets:/data/assets]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: {context: ., dockerfile: Dockerfile.food}
    command: [python, -m, backend.app.domains.jobs.worker]
    environment: *app-env
    volumes: [food-assets:/data/assets]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: {db: {condition: service_healthy}}
volumes:
  food-db:
  food-assets:
