name: FMS checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: food
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: food_fms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U food -d food_fms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://food:test-only-password@127.0.0.1:5432/food_fms_test
      FOOD_ANALYSIS_MODE: rules
      FOOD_SEED_PASSWORD: local-food-2026
      FOOD_OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: node --test frontend/tests/reviewJourney.test.js
      - run: python -m pytest backend/tests -q
