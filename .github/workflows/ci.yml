# ==============================================================================
# FMS_FILE_SPEC
# ci.yml - 프로젝트 설정 ci.yml
# ==============================================================================
# 설명:
#     - 프로젝트 설정 ci.yml
# 입력·출력 명세:
#     - 입력: 도구별 설정·실행 환경
#     - 출력: 해당 도구의 구성 또는 실행 결과
# 실행 가정:
#     - 실제 비밀값과 로컬 실행 데이터는 Git에서 제외
# 작성 정보:
#     - 작성자: 미지정
#     - 이메일: 미지정
#     - 작성일: 2026-10-21 (최초 Git 등록일 기준)
#     - 라이선스: 미지정
#     - 버전: 0.1.0
#     - 상태: Development
# 변경 이력 (Revision History):
#     DATE        AUTHOR      VERSION  DESCRIPTION
#     --------------------------------------------------------------------
#     2026-10-21  미지정      v0.1.0   최초 Git 등록 a11ef05a
#     2026-10-21  미지정      v0.1.0   파일 역할·입출력·가정·이력 명세 추가
#
#     상세 Git 이력: git log --follow -- .github/workflows/ci.yml
#     공통 규칙: doc/file-header-policy.md
# ==============================================================================
name: FMS checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: food
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: food_fms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U food -d food_fms_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://food:test-only-password@127.0.0.1:5432/food_fms_test
      FOOD_ANALYSIS_MODE: rules
      FOOD_SEED_PASSWORD: local-food-2026
      FOOD_OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: node --test frontend/tests/reviewJourney.test.js
      - run: python scripts/file-specs.py --check
      - run: python -m pytest backend/tests -q
